# Fase 1: Flask uniproceso (dev server)
# Uso: docker compose up --build -d  /  docker stats  /  locust -f locustfile.py --host http://localhost:5000
services:
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lab1234
      MYSQL_DATABASE: tienda
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plab1234"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: lab-flask
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: lab1234
      MYSQL_DATABASE: tienda
      MYSQL_POOL_SIZE: 10
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  # Observabilidad Paso 2: http://localhost:9999
  dozzle:
    image: amir20/dozzle:latest
    container_name: lab-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  mysql_data:
